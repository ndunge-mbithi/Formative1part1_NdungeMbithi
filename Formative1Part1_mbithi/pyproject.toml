# Provided in the assignment repo. Students do not edit this file.
# It fixes how `ruff check nn/` and `pytest` behave for the whole project.

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, D: docstring presence + format.
select = ["E", "F", "W", "I", "D"]
# D203/D213 conflict with D211/D212; keep the "no blank line", "summary on
# first line" side.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# __init__.py files are one import line, no docstring (see the guide).
"**/__init__.py" = ["D104", "F401"]
# Test + harness files are not graded on documentation.
"conftest.py" = ["D100", "D101", "D102", "D103"]
"tests/**" = ["D100", "D101", "D102", "D103"]
"_grading/**" = ["D100", "D101", "D102", "D103"]

[tool.pytest.ini_options]
# Bare `pytest` runs only the public checks students are given.
# The full grading suite is run explicitly: `pytest _grading/`.
testpaths = ["tests"]
